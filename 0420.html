<html>
      <head>
          <title>0420-javaScript輸入與輸出</title>
            <script>
                //單行註解
                /*多行
                
                */
                    
                function sayhello(){
                
                name=prompt("how are you?");
                console.log(name);
                document.getElementById("msg").innerHTML="hello "+ name;
            }
                 function calc(){
                   userAns=parseInt(prompt("what you ans?"))
                   
                    n1=parseInt(document.getElementById("n1").value);
                   n2=parseInt(document.getElementById("n2").value);
                   if(isNaN(n1)) n1=0;
                   if(isNaN(n2)) n2=0;
                   document.getElementById("ans").value="ans is "+(n1+n2);
                
                }
                function ch(){
                    document.getElementById("rgn").innerHTML=document.getElementById("rg").value
                }
            </script>
                


      </head>
         <body>
              <button onclick="sayhello();">AAA</button>
                    
              <div id="msg"></div>
              <hr>
              <input type="text"><br>
              <input type="password"><br>
              <input type="number"><br>
              <input type="date"><br>
              <input type="datetime-local"><br>
              <input type="color"><br>
              <input type="number" id="n1"> + <input type="number" id="n2"> = <button onclick="calc()">?</button><br>
              <input type="text" id="ans" disabled>
              <hr>
              <input type="range" id="rg" value="0" oninput="ch();"><span id="rgn">0</span>
        </body>
</html>
