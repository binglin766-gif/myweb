<html>
    <head>

        <title> 宇宙射擊遊戲</title>
    </head>
    <style>
        @keyframes bg_move{
            0%{background-position-y:0px;}
            100%{background-position-y:216px;}
        }
        
        
        #uner{
            width: 600px;
            height: 600px;
            background: url("pic/bg_stars.jpg");
            animation: bg_move 1s linear infinite;
        }
        #ship{
            width: 40px;
            height: 60px;
            position: absolute;
            top:540px;
            left: 280px;
        }
        .ufo{
            width:60px ;
            height: 40px;
            position: absolute;

        }
        .bullet{
            width: 4px;
            height: 6px;
            background-color: red;
            position: absolute;
            border-radius: 100% 100% 0 0;
            top: 534px;
            left: 298px;
        }
    </style>
    <script>
        function die(obj){
            clearInterval(obj.move)
            obj.remove()
        }
        function getRand(min,max){
            return Math.floor(Math.random() * (max - min + 1) + min);
        }
        
        function showpos(obj){
            obj.style.top=obj.pos.y + "px";
            obj.style.left=obj.pos.x + "px";
        }
        function ship_move(){
            if(!gameing) return;
            if(ship.way["ArrowUp"] && ship.pos.y > 0 ) ship.pos.y--;
            else if (ship.way["ArrowDown"] && ship.pos.y < 540 ) ship.pos.y++;
            else if (ship.way["ArrowLeft"] && ship.pos.x >0 ) ship.pos.x--;
            else if (ship.way["ArrowRight"] && ship.pos.x < 560 ) ship.pos.x++;
            showpos(ship)
        }
        function shoot(){
            if(!gameing) return;
            var b=document.createElement("div");
            b.className="bullet"
            b.pos={x:ship.pos.x+18, y:ship.pos.y-6}
            b.move=setInterval(bullet_move,5,b)
            document.getElementById("uner").appendChild(b)
        }
        function bullet_move(b){
            if(b.pos.y < 0){
              die(b)
            }
            else{
                b.pos.y--;
                showpos(b)
                
                
              var hit=Array.from(document.getElementsByClassName("ufo")).filter((u)=>{
                (u.pos.x < b.pos.x) && (u,pos.x + 60 > b.pos.x + 4 ) && (u.pos.y + 40 >= b.pos.y)
                });
                if(hit.length>0){
                    die(b)
                    hit.forEach((u)=>{
                    die(u)
                    });
            
                }
               
            
            
            
            
            }
        
        }
        function ufo_move(u){
            if(!gameing) return; 
            if(u.pos.y > 560){
                clearInterval(u.move);
                u.remove();
                game_stop()
            }
            else{
                u.pos.x+=getRand(-5,5);
                u.pos.y++;
               
                showpos(u)
            }
        }
        function ufo_c(){
             if(!gameing) return; 
            var u=document.createElement("img");
            u.src="pic/ufo.png";
            u.className="ufo"
            u.pos={x:getRand(0,540),y:0}
            showpos(u)
            u.move=setInterval(ufo_move,20,u)
            document.getElementById("uner").appendChild(u)
        }
        
        function game_start(){
            if(gameing) return;
            
            gameing=true
            game_score=0
            setInterval(ufo_c,1000)
        }
        function game_stop(){
            gameing=false
            Array.from(document.getElementsByClassName("ufo")).forEach((u=>{
                die(u)
            }))
        }
        function game_init(){
            ship=document.getElementById("ship");
            ship.pos={x:280,y:540};
            ship.way={"ArrowDown":0,"ArrowLeft":0,"ArrowRight":0,"ArrowUp":0};
            ship.move=setInterval(ship_move,5);
        
        
            gameing=false;
            game_start()
        }
        function kd(){
            event.preventDefault();
            if(Object.keys(ship.way).includes(event.key)){
                ship.way[event.key]=1;
            }
            else if(event.key==" "){
                shoot(); 
            }
        }
        function ku(){
            event.preventDefault();
            if(Object.keys(ship.way).includes(event.key)){
                ship.way[event.key]=0;
            }
        }
        
    </script>
    
    
    
    
    <body onload="game_init()" onkeydown="kd()" onkeyup="ku()">
         <div id="point">得分:<span id="score">0</span>P</div>
        <div id="uner" onclick="game_start()">
             
            <img id="ship" src="pic/ship.png">
        </div>
        <audio loop id="bgm"></audio>
    </body>
</html>
